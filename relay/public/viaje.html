<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>{{title}}</title>
		<!-- What a link's preview (WhatsApp) shows: whose trip, never where. -->
		<meta property="og:title" content="{{title}}" />
		<meta property="og:description" content="Dónde va ahora, en el mapa, mientras lo comparte." />
		<link rel="stylesheet" href="/maplibre/maplibre-gl.css" />
		<link rel="stylesheet" href="/viaje.css" />
		<script type="module" src="/viaje.js"></script>
	</head>
	<body>
		<div id="mapa"></div>
		<section id="info">
			<h1 id="quien">{{title}}</h1>
			<p id="destino"></p>
			<p id="cuando">Esperando la posición…</p>
		</section>
		<button id="centrar" hidden>Centrar</button>
		<div id="fin" hidden>
			<p>Este viaje ya no se comparte.</p>
		</div>
	</body>
</html>
