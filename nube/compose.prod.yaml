# Production, as a Docker Compose app in Dokploy (Compose Path: ./nube/compose.prod.yaml), as
# svelte-thinking's: Postgres and the app in one stack, the app's image built by GitHub (#277).
# The first time Postgres starts it runs scripts/init-db.sh, which makes the app's role (nube_app)
# with its password: no SQL by hand. The variables, in Dokploy's Environment (README): passwords
# in hex (`openssl rand -hex 24`), as they go inside the URLs below.
name: nube

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: nube
      APP_DB_USER: nube_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nube']
      interval: 5s
      retries: 10
    # Not published: only the app reaches it, on this stack's network, by a name of its own: the
    # app is also on Dokploy's network, where another stack's `db` would answer to that name.
    networks:
      default:
        aliases: [nube-db]

  app:
    # Built by GitHub (.github/workflows/nube-image.yml, #277), not here: Dokploy only pulls it, the
    # latest of its tag each time. NUBE_TAG, another one (a commit's `sha-…`) to go back to it.
    image: ghcr.io/yellowmachine/nube:${NUBE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # As the app's role, to which row-level security applies; the migrations, as the owner.
      DATABASE_URL: postgres://nube_app:${APP_DB_PASSWORD}@nube-db:5432/nube
      MIGRATE_DATABASE_URL: postgres://nube:${POSTGRES_PASSWORD}@nube-db:5432/nube
      ORIGIN: ${ORIGIN:?ORIGIN is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # The families' days and times on the wall (the agenda, the alarms): one zone for now.
      TZ: ${TZ:-Europe/Madrid}
      # The first family and its administrator's invitation, made on starting (scripts/migrate.ts).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_FAMILY: ${ADMIN_FAMILY:-}
      # The app's emails (the landing page's «Pedir acceso»): Proton's SMTP. Without SMTP_HOST, none.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Seilide <no-reply@scholio.review>}
      # The families' files (receipts' photos, bills), in the stack's own rustfs below.
      S3_ENDPOINT: http://nube-rustfs:9000
      S3_BUCKET: nube
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      MAP_DIR: /data/mapa
      ROUTE_MAPS_DIR: /data/recorridos
    # The road mode's map (#78), in a folder of the VPS made with scripts/mapa.sh
    # (`nube/scripts/mapa.sh /opt/nube` → /opt/nube/mapa); read only. Without it, no map. And the strips
    # of it cut around the families' routes, for devices without coverage (#164).
    volumes:
      - ${MAP_HOST_DIR:-/opt/nube/mapa}:/data/mapa:ro
      - recorridos:/data/recorridos
    # Its own network for the database, and Dokploy's for Traefik (the domain, set in Dokploy).
    networks:
      - default
      - dokploy-network

  # The families' files (#253): an S3 storage only the app reaches, on this stack's network, with
  # no ports published. Its user and password, the app's S3 keys (the bucket, made by the app).
  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - files:/data
    # By a name of its own, as `db`: on 2026-10-30 `rustfs` was scholio's, on Dokploy's network
    # (InvalidAccessKeyId).
    networks:
      default:
        aliases: [nube-rustfs]

  # Optional, with `backup` in COMPOSE_PROFILES and the R2_* and BACKUP_AGE_RECIPIENT in Dokploy's
  # Environment (#320): every night, the database, this .env and rustfs's files to a Cloudflare R2
  # bucket, each encrypted with age before it leaves. The houses' image (Dockerfile.backup, Postgres
  # 18 as here); old copies go by the bucket's lifecycle rule. README: «Copias de Seilide».
  backup:
    image: ghcr.io/yellowmachine/jellycartoon-backup:${BACKUP_TAG:-stable}
    profiles: [backup]
    restart: unless-stopped
    # The script is PID 1 otherwise, and PID 1 ignores SIGTERM.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Madrid}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_NAME: seilide
      # As its owner, as the migrations: everything, roles' rows included.
      PGHOST: nube-db
      PGUSER: nube
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: nube
      FILES_S3_ENDPOINT: http://nube-rustfs:9000
      FILES_S3_BUCKET: nube
      FILES_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      FILES_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # The public key (age1…): it encrypts, it cannot decrypt.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      # Dokploy writes its Environment here, next to this file.
      - ./.env:/backup/env:ro

volumes:
  pgdata:
  files:
  recorridos:

networks:
  dokploy-network:
    external: true
