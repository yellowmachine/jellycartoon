# The screenshots' throwaway Seilide (#495), by capturas.ts: Postgres and the families' files, with
# nothing kept (gone with `down -v`), on ports of their own so as not to meet development's (5435, 19000).
name: seilide-capturas

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: nube
      POSTGRES_PASSWORD: nube
      POSTGRES_DB: nube
      APP_DB_USER: nube_app
      APP_DB_PASSWORD: nube_app
    ports:
      - 127.0.0.1:5437:5432
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'nube', '-d', 'nube']
      interval: 1s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: nube
      RUSTFS_SECRET_KEY: nube-desarrollo
    ports:
      - 127.0.0.1:19002:9000
    # Anonymous, removed by `down -v`: it runs without root and cannot write a tmpfs.
    volumes:
      - /data
