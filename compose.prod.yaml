# Production: runs the image built by GitHub Actions (ghcr.io). Only this file and a .env are
# needed on the server.
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# Same project name as compose.yaml, so both use the same database volume.
name: jellycartoon

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: jellycartoon
      # Not exposed outside the compose network. Only applied when the volume is first created.
      POSTGRES_PASSWORD: jellycartoon
      POSTGRES_DB: jellycartoon
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jellycartoon']
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/yellowmachine/jellycartoon:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Files in DATA_DIR belong to this user instead of root.
    user: '${PUID:-1000}:${PGID:-1000}'
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Caddy sends the real protocol; adapter-node assumes https without it (CSRF 403 over http).
      PROTOCOL_HEADER: x-forwarded-proto
      DATABASE_URL: postgres://jellycartoon:jellycartoon@db:5432/jellycartoon
      # The URL the app is opened from (Better Auth's baseURL).
      ORIGIN: ${ORIGIN:?ORIGIN is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      MEDIA_DIR: /media
      DATA_DIR: /data
      # Shown on each episode, to open it with a native player on this PC.
      HOST_DATA_DIR: ${HOST_DATA_DIR}
      # Optional films folder, catalogued but not converted: only with HOST_CINEMA_DIR.
      CINEMA_DIR: ${HOST_CINEMA_DIR:+/cinema}
      HOST_CINEMA_DIR: ${HOST_CINEMA_DIR:-}
      # Optional music folder (FLAC ripped from CDs), played in the browser: only with HOST_MUSIC_DIR.
      MUSIC_DIR: ${HOST_MUSIC_DIR:+/music}
      # The mpv of the Snapcast services below; the app offers Snapcast only while it is there.
      MUSIC_MPV_SOCKET: ${HOST_MUSIC_DIR:+/data/mpv-music.sock}
      # snapserver's control API, to list its clients and set their volume. It is on the host's
      # network, which the app reaches as host.docker.internal (extra_hosts below).
      SNAPSERVER_CONTROL: ${HOST_MUSIC_DIR:+host.docker.internal:1705}
      # mpv on this PC (deploy/jellycartoon-mpv.service) leaves its socket in HOST_DATA_DIR. On by
      # default with films; with series only, MPV_SOCKET=/data/mpv.sock in the .env.
      MPV_SOCKET: ${MPV_SOCKET:-${HOST_CINEMA_DIR:+/data/mpv.sock}}
      AUDIO_LANG: ${AUDIO_LANG:-spa}
      X264_PRESET: ${X264_PRESET:-medium}
      X264_CRF: ${X264_CRF:-20}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      DELETE_SOURCES: ${DELETE_SOURCES:-false}
      TZ: ${TZ:-Europe/Madrid}
      # Optional: the AI for films (identifying them, talking about them). Also settable in Ajustes.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    volumes:
      # Writable only so DELETE_SOURCES can remove converted originals.
      - ${HOST_MEDIA_DIR:?HOST_MEDIA_DIR is required}:/media
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}:/data
      # Read-only: films are never modified. Without HOST_CINEMA_DIR an empty folder is mounted
      # instead, and the app has no Cine section (CINEMA_DIR is unset).
      - ${HOST_CINEMA_DIR:-./no-cinema}:/cinema:ro
      # Read-only too, and an empty folder without HOST_MUSIC_DIR (no Música section).
      - ${HOST_MUSIC_DIR:-./no-music}:/music:ro
    # The host, from inside the container: https://docs.docker.com/reference/compose-file/services/#extra_hosts
    extra_hosts:
      - host.docker.internal:host-gateway

  # Optional, with COMPOSE_PROFILES=snapcast in the .env: the music, to Snapcast clients
  # (snapclient, Snapdroid…). Both run the app's image with another command, and share HOST_DATA_DIR
  # with the app: snapserver's FIFO and state, and the socket of the mpv that plays into it.
  snapserver:
    image: ghcr.io/yellowmachine/jellycartoon:${IMAGE_TAG:-latest}
    profiles: [snapcast]
    restart: unless-stopped
    user: '${PUID:-1000}:${PGID:-1000}'
    # On the host's network: clients reach it on 1704 (audio) and 1705/1780 (control).
    network_mode: host
    command: ['snapserver', '-c', '/etc/jellycartoon/snapserver.conf']
    configs:
      - source: snapserver
        target: /etc/jellycartoon/snapserver.conf
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}:/data
      # The host's D-Bus, so that it announces itself through the host's Avahi (mDNS) and clients
      # find it on their own. Without Avahi on the host, clients are given the host's name.
      - /run/dbus:/run/dbus
    # mpv must not open the FIFO before snapserver creates it: it would make a plain file.
    healthcheck:
      test: ['CMD', 'test', '-p', '/data/snapfifo']
      interval: 2s
      retries: 15

  mpv-music:
    image: ghcr.io/yellowmachine/jellycartoon:${IMAGE_TAG:-latest}
    profiles: [snapcast]
    restart: unless-stopped
    user: '${PUID:-1000}:${PGID:-1000}'
    network_mode: none
    depends_on:
      snapserver:
        condition: service_healthy
    # As in Snapcast's player setup (doc/player_setup.md), at the CDs' 44.1 kHz so that they are
    # not resampled. The output stays open from track to track: albums play without gaps.
    command:
      - mpv
      - --idle
      - --no-config
      - --no-video
      - --audio-display=no
      - --audio-channels=stereo
      - --audio-samplerate=44100
      - --audio-format=s16
      - --ao=pcm
      - --ao-pcm-waveheader=no
      - --ao-pcm-file=/data/snapfifo
      - --input-ipc-server=/data/mpv-music.sock
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}:/data
      # Where the app sees it too: the app sends it the files by their path.
      - ${HOST_MUSIC_DIR:-./no-music}:/music:ro

  # Reverse proxy in front of the app. Only a port, so plain HTTP (no automatic HTTPS). Passes
  # the Host header through and sets X-Forwarded-Proto, ignoring any sent by the client.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    command: caddy reverse-proxy --from :3000 --to app:3000
    ports:
      - 3000:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:

configs:
  snapserver:
    content: |
      [server]
      datadir = /data/snapserver
      [http]
      doc_root = /usr/share/snapserver/snapweb
      [stream]
      source = pipe:///data/snapfifo?name=JellyCartoon&sampleformat=44100:16:2
