# Production: runs the images built by GitHub Actions (ghcr.io). Only this file and a .env are
# needed on the server.
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# IMAGE_TAG chooses the channel: `stable` (the default) is the latest release; `latest`, every
# change to main. With the `updates` profile, WUD keeps it up to date (see the wud service).
#
# Same project name as compose.yaml, so both use the same database volume.
name: jellycartoon

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: jellycartoon
      # Not exposed outside the compose network. Only applied when the volume is first created.
      POSTGRES_PASSWORD: jellycartoon
      POSTGRES_DB: jellycartoon
    volumes:
      - pgdata:/var/lib/postgresql
      # The copies WUD makes right before updating (the app's labels below).
      - ./update-backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jellycartoon']
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/yellowmachine/jellycartoon:${IMAGE_TAG:-stable}
    restart: unless-stopped
    # Files in DATA_DIR belong to this user instead of root.
    user: '${PUID:-1000}:${PGID:-1000}'
    depends_on:
      db:
        condition: service_healthy
    # Only on this machine, to debug: browsers reach it through Caddy (below), over HTTPS.
    # adapter-node assumes https, which is what the browser uses there.
    ports:
      - 127.0.0.1:3000:3000
    environment:
      DATABASE_URL: postgres://jellycartoon:jellycartoon@db:5432/jellycartoon
      # The URL the app is opened from (Better Auth's baseURL), served by Caddy.
      ORIGIN: ${ORIGIN:?ORIGIN is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      MEDIA_DIR: /media
      DATA_DIR: /data
      # Shown on each episode, to open it with a native player on this PC.
      HOST_DATA_DIR: ${HOST_DATA_DIR}
      # Optional films folder, catalogued but not converted: only with HOST_CINEMA_DIR.
      CINEMA_DIR: ${HOST_CINEMA_DIR:+/cinema}
      HOST_CINEMA_DIR: ${HOST_CINEMA_DIR:-}
      # Optional music folder (FLAC ripped from CDs), played in the browser: only with HOST_MUSIC_DIR.
      MUSIC_DIR: ${HOST_MUSIC_DIR:+/music}
      # The mpv of the Snapcast services below; the app offers Snapcast only while it is there.
      MUSIC_MPV_SOCKET: ${HOST_MUSIC_DIR:+/data/mpv-music.sock}
      # snapserver's control API, to list its clients and set their volume. It is on the host's
      # network, which the app reaches as host.docker.internal (extra_hosts below).
      SNAPSERVER_CONTROL: ${HOST_MUSIC_DIR:+host.docker.internal:1705}
      # mpv on this PC (deploy/jellycartoon-mpv.service) leaves its socket in HOST_DATA_DIR. On by
      # default with films; with series only, MPV_SOCKET=/data/mpv.sock in the .env.
      MPV_SOCKET: ${MPV_SOCKET:-${HOST_CINEMA_DIR:+/data/mpv.sock}}
      AUDIO_LANG: ${AUDIO_LANG:-spa}
      X264_PRESET: ${X264_PRESET:-medium}
      X264_CRF: ${X264_CRF:-20}
      DELETE_SOURCES: ${DELETE_SOURCES:-false}
      TZ: ${TZ:-Europe/Madrid}
      # Optional: the AI for films (identifying them, talking about them). Also settable in Ajustes.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # With the `voz` profile (WHISPER_MODEL in the .env): the whisper service below, for voice.
      WHISPER_URL: ${WHISPER_MODEL:+http://whisper:8080}
      # Its twin, only for the automatic subtitles: the voice does not wait behind them.
      WHISPER_SUBTITLES_URL: ${WHISPER_MODEL:+http://whisper-subtitulos:8080}
      # Optional: Ollama's vision model labels episodes (e.g. Ollama on this PC, listening on
      # 0.0.0.0, as http://host.docker.internal:11434).
      OLLAMA_URL: ${OLLAMA_URL:-}
      LABEL_MODEL: ${LABEL_MODEL:-qwen2.5vl:7b}
      LABEL_EVERY_SEC: ${LABEL_EVERY_SEC:-15}
      # Optional: the voice of Música's DJ mode, Piper's HTTP server on this PC (listening on 0.0.0.0).
      PIPER_URL: ${PIPER_URL:-}
      PIPER_VOICE_ES: ${PIPER_VOICE_ES:-es_ES-davefx-medium}
      PIPER_VOICE_EN: ${PIPER_VOICE_EN:-en_US-lessac-medium}
      # Optional: the player made in Dailymotion Studio for the children's cartoons (#66).
      DAILYMOTION_PLAYER_ID: ${DAILYMOTION_PLAYER_ID:-}
      # With the `updates` profile: the admin updates from the notice of a new version. Without
      # WUD_PASSWORD in the .env the app does not offer it, so the address can always be here.
      WUD_URL: http://wud:3000
      WUD_PASSWORD: ${WUD_PASSWORD:-}
    labels:
      # Updated by WUD to each release (#20), and given back its previous version if it does not
      # start healthy (the image's HEALTHCHECK).
      - wud.watch=true
      - wud.rollback.enable=true
      # Before updating, a copy of the database, kept with the three before it; if it fails, the
      # update is cancelled. Migrations cannot be undone: this copy and the previous image can.
      - wud.hook.1.phase=pre
      - wud.hook.1.type=exec
      - wud.hook.1.target=jellycartoon-db-1
      - wud.hook.1.timeout=600000
      - >-
        wud.hook.1.command=umask 077 && f=/backups/antes-de-actualizar-$$(date -u +%Y%m%dT%H%MZ).dump &&
        pg_dump -U jellycartoon -Fc jellycartoon > $$f.part && mv $$f.part $$f &&
        ls -1t /backups/antes-de-actualizar-*.dump | tail -n +5 | xargs -r rm --
    volumes:
      # Writable only so DELETE_SOURCES can remove converted originals.
      - ${HOST_MEDIA_DIR:?HOST_MEDIA_DIR is required}:/media
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}:/data
      # Read-only: films are never modified. Without HOST_CINEMA_DIR an empty folder is mounted
      # instead, and the app has no Cine section (CINEMA_DIR is unset).
      - ${HOST_CINEMA_DIR:-./no-cinema}:/cinema:ro
      # Read-only too, and an empty folder without HOST_MUSIC_DIR (no Música section).
      - ${HOST_MUSIC_DIR:-./no-music}:/music:ro
    # The host, from inside the container: https://docs.docker.com/reference/compose-file/services/#extra_hosts
    extra_hosts:
      - host.docker.internal:host-gateway

  # HTTPS in front of the app, at ORIGIN's domain. Its DNS record points to this machine's Tailscale
  # IP or its IP at home, so only the tailnet or the house's network reach it; Let's Encrypt can't,
  # and the certificate comes from Cloudflare's DNS-01 challenge instead. The official image doesn't
  # have that module: GitHub Actions builds one with it (Dockerfile.caddy). Without a domain, at
  # home only, TLS=internal: Caddy's own authority signs it, and each device installs its root.
  caddy:
    image: ghcr.io/yellowmachine/jellycartoon-caddy:${IMAGE_TAG:-stable}
    restart: unless-stopped
    labels:
      - wud.watch=true
    depends_on:
      - app
    # On every interface rather than just the Tailscale IP: Docker may start before tailscaled.
    ports:
      - 443:443
      - 443:443/udp
    environment:
      # The site address (https://<domain>), for the Caddyfile in the image (deploy/Caddyfile).
      ORIGIN: ${ORIGIN:?ORIGIN is required}
      # Cloudflare API token with Zone.Zone:Read and Zone.DNS:Edit on the domain's zone.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      # `cloudflare` (a domain, the default) or `internal` (at home only, without one): README.
      TLS: ${TLS:-cloudflare}
    volumes:
      # Certificates and the ACME account: without them, a new certificate on every start.
      - caddy_data:/data
      - caddy_config:/config

  # Optional, with COMPOSE_PROFILES=snapcast in the .env: the music, to Snapcast clients
  # (snapclient, Snapdroid…). Both run the app's image with another command, and share HOST_DATA_DIR
  # with the app: snapserver's FIFO and state, and the socket of the mpv that plays into it.
  snapserver:
    image: ghcr.io/yellowmachine/jellycartoon:${IMAGE_TAG:-stable}
    profiles: [snapcast]
    restart: unless-stopped
    user: '${PUID:-1000}:${PGID:-1000}'
    # On the host's network: clients reach it on 1704 (audio) and 1705/1780 (control).
    network_mode: host
    command: ['snapserver', '-c', '/etc/jellycartoon/snapserver.conf']
    labels:
      - wud.watch=true
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}:/data
      # The host's D-Bus, so that it announces itself through the host's Avahi (mDNS) and clients
      # find it on their own. Without Avahi on the host, clients are given the host's name.
      - /run/dbus:/run/dbus
    # mpv must not open the FIFO before snapserver creates it: it would make a plain file.
    healthcheck:
      test: ['CMD', 'test', '-p', '/data/snapfifo']
      interval: 2s
      retries: 15

  mpv-music:
    image: ghcr.io/yellowmachine/jellycartoon:${IMAGE_TAG:-stable}
    profiles: [snapcast]
    restart: unless-stopped
    user: '${PUID:-1000}:${PGID:-1000}'
    # The default network: radio stations are streamed from the internet.
    depends_on:
      snapserver:
        condition: service_healthy
    labels:
      - wud.watch=true
    # The image's is the app's, which does not run here.
    healthcheck:
      disable: true
    # As in Snapcast's player setup (doc/player_setup.md), at the CDs' 44.1 kHz so that they are
    # not resampled. The output stays open from track to track: albums play without gaps.
    command:
      - mpv
      - --idle
      - --no-config
      - --no-video
      - --audio-display=no
      - --audio-channels=stereo
      - --audio-samplerate=44100
      - --audio-format=s16
      - --ao=pcm
      - --ao-pcm-waveheader=no
      - --ao-pcm-file=/data/snapfifo
      - --input-ipc-server=/data/mpv-music.sock
    volumes:
      - ${HOST_DATA_DIR:?HOST_DATA_DIR is required}:/data
      # Where the app sees it too: the app sends it the files by their path.
      - ${HOST_MUSIC_DIR:-./no-music}:/music:ro

  # Optional, with `voz` in COMPOSE_PROFILES and WHISPER_MODEL in the .env: speech to text for voice
  # commands (#33), with whisper.cpp's own server on the GPU (Vulkan, /dev/dri). Only the app
  # reaches it, on the compose network: its README asks not to expose it, as it takes files and
  # runs ffmpeg. Pinned to the image of a release (v1.9.5); WUD does not touch it.
  whisper: &whisper
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan-d1be6fde11ac6e0407606b4e42fe72d34add8037
    profiles: [voz]
    restart: unless-stopped
    devices:
      - /dev/dri
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    # The model, the first time, with the image's download-ggml-model.sh (as in its README), to a
    # folder apart (its own: two servers may start at once) and then moved, so that a download cut
    # halfway is not taken for the model. Then the server: in Spanish, and converting with ffmpeg
    # what the browser records (--convert). With WHISPER_DTW, each word timed against the audio
    # (-dtw, its model's name as whisper.cpp writes it, e.g. large-v3-turbo-q5_0 is large.v3.turbo),
    # for subtitles that start when the words do (#86); it does not work with flash attention (-nfa),
    # which the voice keeps, being quicker.
    command:
      - bash
      - -c
      - >-
        m=/models/ggml-$$WHISPER_MODEL.bin;
        if [ ! -f $$m ]; then
        d=/models/.download-$$HOSTNAME;
        rm -rf $$d && mkdir $$d &&
        download-ggml-model.sh $$WHISPER_MODEL $$d &&
        mv $$d/ggml-$$WHISPER_MODEL.bin $$m && rm -rf $$d || exit 1;
        fi;
        extra=;
        if [ -n "$$WHISPER_DTW" ]; then
        dtw=$${WHISPER_MODEL%-q[0-9]*}; extra="-nfa -dtw $${dtw//-/.}";
        fi;
        exec whisper-server --host 0.0.0.0 --port 8080 -m $$m -l es --convert $$extra
    volumes:
      - whisper_models:/models

  # The same, only for the automatic subtitles, with DTW: a server takes one request at a time, and
  # a voice command waited behind a piece of a film (#86). The same model and volume; about 1 GB
  # more of the GPU's memory with `small`.
  whisper-subtitulos:
    <<: *whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DTW: 'yes'

  # Optional, with `updates` in COMPOSE_PROFILES (e.g. `snapcast,updates`) and WUD_PASSWORD in the
  # .env: WUD (What's Up Docker, https://github.com/getwud/wud) installs each new release of
  # JellyCartoon (#20), at night (UPDATE_CRON) or when the admin asks from the app. It only touches
  # the services labelled wud.watch=true: not Postgres, nor anything else on the machine.
  wud:
    image: getwud/wud:9
    profiles: [updates]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      WUD_WATCHER_LOCAL_CRON: ${UPDATE_CRON:-0 4 * * *}
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: 'false'
      # Pulls the new image and recreates each container as it was, then removes the old image. The
      # `docker` trigger and not `dockercompose`: in WUD 9.4.1 only it applies a new image under the
      # same tag (`stable`), and it does not need to see this folder.
      WUD_TRIGGER_DOCKER_JELLYCARTOON_PRUNE: 'true'
      # Its web (http://127.0.0.1:3001 on this machine) and the API the app uses.
      WUD_AUTH_ADMIN_USER: admin
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_PASSWORD:-}
    volumes:
      # Control of Docker: whoever controls WUD controls this machine's containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - wud_store:/store
    # Only on this machine; the app reaches it on the compose network.
    ports:
      - 127.0.0.1:3001:3000

  # Optional, with `backup` in COMPOSE_PROFILES and the R2_* and BACKUP_AGE_RECIPIENT of the .env:
  # every night, the database to a Cloudflare R2 bucket, encrypted with age before it leaves (see
  # «Copia en Cloudflare R2» in the README). Old copies go by the bucket's lifecycle rule.
  backup:
    image: ghcr.io/yellowmachine/jellycartoon-backup:${IMAGE_TAG:-stable}
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Madrid}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      PGHOST: db
      PGUSER: jellycartoon
      PGPASSWORD: jellycartoon
      PGDATABASE: jellycartoon
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # The public key (age1…): it encrypts, it cannot decrypt.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    labels:
      - wud.watch=true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  wud_store:
  whisper_models:
