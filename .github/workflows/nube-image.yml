name: Nube image

# The cloud's image (#253, #277), built here and not on the VPS: every push to main that touches it
# is `main` (and its commit's `sha-…`), which nube/compose.prod.yaml runs, as the house's releases
# go from main too. Then
# Dokploy is told to deploy it, by its webhook, as svelte-thinking and Langua: it only pulls and
# starts. Its name is the folder's for now: renamed, this and the compose change together.
on:
  push:
    branches: [main]
    paths:
      - 'nube/**'
      - 'packages/comun/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/nube-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nube-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nube

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha

      - id: push
        uses: docker/build-push-action@v7
        with:
          # From the repository's root: it uses packages/comun.
          context: .
          file: nube/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own cache scope, apart from the house's images.
          cache-from: type=gha,scope=nube
          cache-to: type=gha,scope=nube,mode=max

  # Once the image is there: Dokploy pulls it and starts it (Autodeploy on, its webhook in the
  # DOKPLOY_NUBE_WEBHOOK_URL secret). Without the secret, nothing: deployed by hand from Dokploy.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DOKPLOY_NUBE_WEBHOOK_URL }}
    steps:
      - uses: docker/setup-buildx-action@v4
        if: env.WEBHOOK != ''

      # `pull_policy: always` only helps if `:main` on GHCR already points at the image just
      # pushed: firing the webhook at once can race the tag and pull the one before. Until it does.
      - name: Wait for the tag to be this image
        if: env.WEBHOOK != ''
        env:
          TARGET: ${{ needs.build.outputs.digest }}
        run: |
          for i in $(seq 1 30); do
            current=$(docker buildx imagetools inspect "$IMAGE:main" 2>/dev/null \
              | awk '/^Digest:/ { print $2; exit }')
            if [ "$current" = "$TARGET" ]; then
              echo "Ya es esta imagen ($i)"
              exit 0
            fi
            echo "Intento $i/30: es '$current', se espera '$TARGET'"
            sleep 5
          done
          echo "::error::La etiqueta no llegó a ser $TARGET"
          exit 1

      # Dokploy's webhook is the one its own GitHub integration calls on every push: only with
      # GitHub's event header and a ref in the body is it a deploy (else a 301, «Branch Not Match»,
      # which curl does not take as a failure), as svelte-thinking learnt.
      - name: Deploy on Dokploy
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::Sin DOKPLOY_NUBE_WEBHOOK_URL: despliégala desde Dokploy."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dokploy.txt -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            -d "{\"ref\": \"refs/heads/${{ github.ref_name }}\", \"commits\": []}")
          echo "HTTP $status"; cat /tmp/dokploy.txt
          if [ "$status" != "200" ]; then
            echo "::error::Dokploy contestó HTTP $status"
            exit 1
          fi
