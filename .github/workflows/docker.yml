name: Docker image

# Two channels (#20): every push to main is `latest`, for trying things; a published release
# (`v1.2.0`) is `1.2.0`, `1.2` and `stable`, which installs follow and WUD updates them to.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Each image for a PC (amd64) and a Raspberry (arm64, #378; the satellite's since #296): each on
  # its own runner, not emulated (onnxruntime-node and Bun under QEMU), pushed by digest and joined
  # below into one image for both, as Docker documents it:
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  #
  # - app: the house's app (Dockerfile).
  # - caddy: Caddy for compose.prod.yaml, with the Cloudflare DNS module (Dockerfile.caddy).
  # - backup: the nightly copy of the database to Cloudflare R2 (Dockerfile.backup).
  # - rathole: the tunnel's client, rathole's own release for both (Dockerfile.rathole).
  # - satellite: the voice satellite (satellite/Dockerfile).
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: app, suffix: '', file: Dockerfile }
          - { name: caddy, suffix: -caddy, file: Dockerfile.caddy }
          - { name: backup, suffix: -backup, file: Dockerfile.backup }
          - { name: rathole, suffix: -rathole, file: Dockerfile.rathole }
          - { name: satellite, suffix: -satellite, file: satellite/Dockerfile }
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, pair: linux-amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, pair: linux-arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Its tags only for the version the app shows: they are put on in `merge`.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}${{ matrix.image.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' }}
            type=sha
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the app shows and compares with the latest release (only the app's uses it).
          build-args: |
            APP_VERSION=${{ github.event_name == 'release' && steps.meta.outputs.version || format('sha-{0}', github.sha) }}
          outputs: type=image,name=${{ env.IMAGE }}${{ matrix.image.suffix }},push-by-digest=true,name-canonical=true,push=true
          # Its own cache scope, apart from the others'.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.pair }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.pair }},mode=max

      - run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Both platforms of each, under the channels' tags.
  merge:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: app, suffix: '' }
          - { name: caddy, suffix: -caddy }
          - { name: backup, suffix: -backup }
          - { name: rathole, suffix: -rathole }
          - { name: satellite, suffix: -satellite }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}${{ matrix.image.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}${{ matrix.image.suffix }}@sha256:%s ' *)

      - run: docker buildx imagetools inspect ${{ env.IMAGE }}${{ matrix.image.suffix }}:${{ steps.meta.outputs.version }}

  # A release to Slack once its images are there (or could not be built): from then on, «Actualizar
  # ahora» installs it. By an incoming webhook, the repository's SLACK_WEBHOOK_URL secret.
  slack:
    needs: [build, merge]
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # The payload as a file, built by jq: the notes may have anything in them.
      - env:
          OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
          VERSION: ${{ github.event.release.name || github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The house's app (the repository's APP_URL variable, as https://casa.example): its
          # Versión section, with the new one's notes and «Actualizar ahora».
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ "$OK" = true ]; then
            text="✅ JellyCartoon $VERSION, lista para instalar: <$URL|notas>"
            [ -n "$APP_URL" ] && text="$text · <${APP_URL%/}/ajustes?seccion=casa#version|actualizar en la app>"
            text="$text"$'\n\n'"$NOTES"
          else
            text="❌ JellyCartoon $VERSION: no se pudieron construir las imágenes. <$RUN|Ver el error>"
          fi
          jq -n --arg text "$text" '{text: $text}' > payload.json

      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: payload.json
          # A wrong webhook fails in seconds, with Slack's answer, rather than minutes of retries
          # and nothing in the log.
          retries: rapid
          errors: true
