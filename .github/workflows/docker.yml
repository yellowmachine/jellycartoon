name: Docker image

# Two channels (#20): every push to main is `latest`, for trying things; a published release
# (`v1.2.0`) is `1.2.0`, `1.2` and `stable`, which installs follow and WUD updates them to.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the app shows and compares with the latest release.
          build-args: |
            APP_VERSION=${{ github.event_name == 'release' && steps.meta.outputs.version || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Caddy for compose.prod.yaml, with the Cloudflare DNS module (Dockerfile.caddy).
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-caddy
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.caddy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own cache scope, apart from the app's.
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  # The nightly copy of the database to Cloudflare R2 (Dockerfile.backup, `backup` profile).
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-backup
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backup
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own cache scope, apart from the others'.
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

  # A release to Slack once its images are there (or could not be built): from then on, «Actualizar
  # ahora» installs it. By an incoming webhook, the repository's SLACK_WEBHOOK_URL secret.
  # The voice satellite (#296), for a Raspberry (arm64) or a PC (amd64): each on its own runner,
  # not emulated (onnxruntime-node and Bun under QEMU), pushed by digest and joined below into one
  # image for both, as Docker documents it:
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  satellite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-satellite

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: satellite/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }}-satellite,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=satellite-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=satellite-${{ env.PLATFORM_PAIR }},mode=max

      - run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: satellite-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Both platforms, under the channels' tags, as the app's.
  satellite-merge:
    needs: satellite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: satellite-digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-satellite
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}-satellite@sha256:%s ' *)

      - run: docker buildx imagetools inspect ${{ env.IMAGE }}-satellite:${{ steps.meta.outputs.version }}

  slack:
    needs: [build, caddy, backup, satellite-merge]
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # The payload as a file, built by jq: the notes may have anything in them.
      - env:
          OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
          VERSION: ${{ github.event.release.name || github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The house's app (the repository's APP_URL variable, as https://casa.example): its
          # Versión section, with the new one's notes and «Actualizar ahora».
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ "$OK" = true ]; then
            text="✅ JellyCartoon $VERSION, lista para instalar: <$URL|notas>"
            [ -n "$APP_URL" ] && text="$text · <${APP_URL%/}/ajustes?seccion=casa#version|actualizar en la app>"
            text="$text"$'\n\n'"$NOTES"
          else
            text="❌ JellyCartoon $VERSION: no se pudieron construir las imágenes. <$RUN|Ver el error>"
          fi
          jq -n --arg text "$text" '{text: $text}' > payload.json

      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: payload.json
          # A wrong webhook fails in seconds, with Slack's answer, rather than minutes of retries
          # and nothing in the log.
          retries: rapid
          errors: true
