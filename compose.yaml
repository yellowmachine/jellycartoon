# Development: only the database, for `bun run dev`. Production uses compose.prod.yaml.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: jellycartoon
      POSTGRES_PASSWORD: jellycartoon
      POSTGRES_DB: jellycartoon
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jellycartoon']
      interval: 5s
      retries: 10

volumes:
  pgdata:
