# Teclas del mando del salón en el mpv de la app: ~/.config/mpv/input.conf del PC del salón
# (README, «Mando del salón»). Play/Pausa, el micrófono e Inicio llegan como F8, F9 y F7 por
# deploy/70-mando-g20s.hwdb.

# Play/Pausa pausa o sigue.
F8 cycle pause
# OK y Menú abren el menú de subtítulos y audio (scripts/mando.lua); dentro del menú, OK elige.
# Por defecto OK sería playlist-next, y pasaría al capítulo siguiente sin querer.
ENTER script-binding mando/menu
MENU script-binding mando/menu
# Volver es un ESC: cierra el menú si está abierto y, si no, para lo que se ve, como el ESC del
# servicio (deploy/jellycartoon-mpv.service), y se vuelve a la vista TV del navegador.
GO_BACK keypress ESC
# Flechas: arriba enseña los controles de mpv (la barra con el tiempo) 3 s (script-opts/osc.conf),
# abajo los esconde antes; izquierda y derecha mueven 10 s atrás o adelante. Las de fábrica de mpv
# (±5 s, ±60 s) se notaban todas como «avanzar». `exact`: atrás va de verdad atrás, sin saltar
# al fotograma clave. Dentro del menú (mando.lua) las flechas siguen siendo del menú.
UP script-message-to osc osc-show
DOWN script-message-to osc osc-hide
LEFT seek -10 exact
RIGHT seek 10 exact
# Inicio para lo que se ve.
F7 stop
# El micrófono (F9) habla también con mpv delante: mpv se lo dice a la app, y la vista TV, debajo,
# escucha y escribe aquí lo que oye y contesta (src/lib/components/TvVoice.svelte).
F9 script-message jellycartoon-voz
# Los números del mando cambiarían contraste, brillo, gamma, saturación y volumen de mpv sin querer.
1 ignore
2 ignore
3 ignore
4 ignore
5 ignore
6 ignore
7 ignore
8 ignore
9 ignore
0 ignore
