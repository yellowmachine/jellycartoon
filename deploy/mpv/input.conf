# Teclas del mando del salón en el mpv de la app: ~/.config/mpv/input.conf del PC del salón
# (README, «Mando del salón»). Play/Pausa, el micrófono e Inicio llegan como F8, F9 y F7 por
# deploy/70-mando-g20s.hwdb.

# Play/Pausa pausa o sigue.
F8 cycle pause
# OK y Menú abren el menú de subtítulos y audio (scripts/mando.lua); dentro del menú, OK elige.
# Por defecto OK sería playlist-next, y pasaría al capítulo siguiente sin querer.
ENTER script-binding mando/menu
MENU script-binding mando/menu
# Volver es un ESC: cierra el menú si está abierto y, si no, para lo que se ve, como el ESC del
# servicio (deploy/jellycartoon-mpv.service), y se vuelve a la vista TV del navegador.
GO_BACK keypress ESC
# Inicio para lo que se ve.
F7 stop
# Los números del mando cambiarían contraste, brillo, gamma, saturación y volumen de mpv sin querer.
1 ignore
2 ignore
3 ignore
4 ignore
5 ignore
6 ignore
7 ignore
8 ignore
9 ignore
0 ignore
