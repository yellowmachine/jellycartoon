# Los controles de mpv (la barra con el tiempo) del PC del salón: ~/.config/mpv/script-opts/osc.conf
# (scripts/pantalla.sh). Arriba en el mando los enseña (input.conf, osc-show) y se esconden solos
# tras `hidetimeout` milisegundos; los 500 de fábrica, con el fundido, apenas eran un segundo.
# https://mpv.io/manual/stable/#on-screen-controller
hidetimeout=3000
