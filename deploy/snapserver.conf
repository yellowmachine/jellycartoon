# The snapserver of compose.prod.yaml (snapserver service), in the app's image: so that it is still
# there when WUD recreates the container.
[server]
datadir = /data/snapserver
[http]
doc_root = /usr/share/snapserver/snapweb
[stream]
source = pipe:///data/snapfifo?name=JellyCartoon&sampleformat=44100:16:2
# Both written by PulseAudio (deploy/pulse.pa): this one, the same music with the satellites' answers
# (#223) on top. The speakers that are to say one are moved to it, and back after. Second, as new
# clients get the first.
source = pipe:///data/snapvoz?name=Voz&sampleformat=44100:16:2
