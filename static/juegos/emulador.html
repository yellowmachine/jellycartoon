<!doctype html>
<!--
	The games' player (#176): EmulatorJS (GPL-3.0, https://emulatorjs.org), as its docs embed it, with
	its files from its CDN at a fixed version (cores only work with their own version). Opened in a
	frame by /tv/juegos/[system]/[file]/jugar, with the system, the game's URL, its title, where its
	captures go and, for arcade games, their BIOS.
-->
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Juego</title>
		<style>
			html,
			body,
			#game {
				margin: 0;
				width: 100%;
				height: 100%;
				background: #000;
				overflow: hidden;
			}
		</style>
	</head>
	<body>
		<div id="game"></div>
		<script>
			const params = new URLSearchParams(location.search);
			const rom = params.get('rom') ?? '';
			// Only the app's games.
			if (rom.startsWith('/api/juegos/')) {
				window.EJS_player = '#game';
				window.EJS_core = params.get('core');
				window.EJS_gameUrl = rom;
				window.EJS_gameName = params.get('title');
				window.EJS_pathtodata = 'https://cdn.emulatorjs.org/4.2.3/data/';
				window.EJS_language = 'es-ES';
				// Straight into the game: it was chosen with the remote already.
				window.EJS_startOnLoaded = true;
				// «Guardar Estado» into this browser rather than a file to download, in the living room.
				// The cartridge's save every minute rather than every five: to the server, when it changed.
				window.EJS_defaultOptions = {
					'save-state-location': 'browser',
					'save-save-interval': '60'
				};
				// A BIOS (Neo Geo's `neogeo.zip`), next to the game and as it is: FBNeo looks for it
				// there, zipped. EJS_biosUrl would unzip it.
				const bios = params.get('bios') ?? '';
				if (bios.startsWith('/api/juegos/'))
					window.EJS_externalFiles = { [`/${decodeURIComponent(bios.split('/').pop())}`]: bios };
				// EmulatorJS gives a player only to a gamepad it sees arrive: one the browser showed it
				// from the start (pressed just before, as when coming from a saved game) had none, and
				// did nothing in the game. To the first free player, as it does with the others.
				const ready = Promise.withResolvers();
				/** Once the game has started with the person's cartridge (/jugar waits for it). */
				window.cartridgeReady = ready.promise;
				window.EJS_onGameStart = async () => {
					const emulator = window.EJS_emulator;
					for (const pad of emulator.gamepad.gamepads) {
						const name = `${pad.id}_${pad.index}`;
						const free = emulator.gamepadSelection.indexOf('');
						if (!emulator.gamepadSelection.includes(name) && free >= 0)
							emulator.gamepadSelection[free] = name;
					}
					emulator.updateGamepadLabels();
					// The person's buttons (/juegos/mando), over EmulatorJS' own and what its menu kept.
					// The gamepad's buttons given here do nothing else.
					const given = new Set(Object.values(controls));
					for (const [id, control] of Object.entries(emulator.controls[0]))
						if (!(id in controls) && given.has(control.value2)) delete control.value2;
					for (const [id, pad] of Object.entries(controls))
						(emulator.controls[0][id] ??= {}).value2 = pad;
					await loadCartridge(emulator).catch(() => {});
					emulator.on('saveSaveFiles', sendCartridge);
					ready.resolve();
				};
				const loader = document.createElement('script');
				loader.src = window.EJS_pathtodata + 'loader.js';
				document.body.append(loader);
			}
			const backdrop = params.get('backdrop') ?? '';
			/** Each of the console's buttons to the gamepad's that does it (game-controls.ts). */
			const controls = (() => {
				try {
					return JSON.parse(params.get('controls') ?? '{}') ?? {};
				} catch {
					return {};
				}
			})();

			/**
			 * The cartridge's save (#176), what the game itself saves: the person's, on the server.
			 * EmulatorJS keeps it in this browser too, shared by everyone who plays here, and the core
			 * has read that one when the game starts.
			 */
			const cartridge = params.get('cartridge') ?? '';
			/** Only once the server's was read: never an older one over it. */
			let syncing = false;
			/** What the server has: sent again only when it changes. */
			let sent = null;
			let sending = Promise.resolve();
			/** Closing the tab or the browser: what is sent then has to outlive the page. */
			let leaving = false;
			addEventListener('beforeunload', () => (leaving = true), true);
			const same = (a, b) => a && b && a.length === b.length && a.every((x, i) => x === b[i]);

			async function loadCartridge(emulator) {
				if (!cartridge.startsWith('/api/juegos/cartucho/')) return;
				const manager = emulator.gameManager;
				const file = manager.getSaveFilePath();
				const here = manager.FS.analyzePath(file).exists ? manager.FS.readFile(file) : null;
				const res = await fetch(cartridge);
				let theirs;
				if (res.ok) {
					const unzipped = res.body.pipeThrough(new DecompressionStream('gzip'));
					theirs = new Uint8Array(await new Response(unzipped).arrayBuffer());
				} else if (res.status === 404) {
					const { nadie } = await res.json();
					// Nobody has one yet: the one played here before it was kept on the server.
					if (nadie) {
						syncing = true;
						if (here) sendCartridge(here);
						return;
					}
					// Someone else's: the person starts with an empty one.
					theirs = here && new Uint8Array(here.length);
				} else return;
				sent = theirs;
				syncing = true;
				if (!theirs || same(theirs, here)) return;
				manager.FS.writeFile(file, theirs);
				manager.loadSaveFiles();
				// From the beginning with it: many games read it only when they start.
				manager.restart();
			}

			function sendCartridge(bytes) {
				if (!syncing || !bytes?.length || same(bytes, sent)) return;
				sent = bytes;
				sending = fetch(cartridge, {
					method: 'PUT',
					body: bytes,
					// A browser lets a page that closes send this much at most.
					keepalive: leaving && bytes.length < 60_000
				})
					.then((res) => {
						if (!res.ok) throw new Error(res.statusText);
					})
					.catch(() => {
						// Sent again next time.
						sent = null;
					});
			}

			/** The cartridge's save now, to the server, for /jugar before the frame goes. */
			window.saveCartridge = () => {
				window.EJS_emulator?.gameManager.saveSaveFiles();
				return sending;
			};

			/**
			 * The game's picture (its canvas, without EmulatorJS' menus), as the browser shows it now:
			 * a stream of the canvas that only takes a frame when asked (captureStream(0) and
			 * requestFrame). Not EmulatorJS' own captures: in 4.2.3 `retroarch` waits forever for a
			 * file the core never writes, and `canvas` reads the WebGL canvas, which is black whenever
			 * the game draws nothing in that screen frame (often: a 50 Hz game on a 60 Hz TV). Nor the
			 * next frame the game draws: on a still screen (Columns' title) it may never come.
			 */
			async function picture(emulator) {
				const [track] = emulator.canvas.captureStream(0).getVideoTracks();
				try {
					const grabbed = new ImageCapture(track).grabFrame();
					track.requestFrame();
					const frame = await Promise.race([
						grabbed,
						new Promise((_, fail) => setTimeout(() => fail(new Error('Sin imagen')), 3000))
					]);
					// Only the game: the canvas fills the screen, with black bars at its sides.
					const aspect = emulator.gameManager.getVideoDimensions('aspect') || 4 / 3;
					const height = Math.min(frame.height, Math.round(frame.width / aspect));
					const width = Math.round(height * aspect);
					const out = new OffscreenCanvas(width, height);
					const x = (frame.width - width) / 2;
					const y = (frame.height - height) / 2;
					out.getContext('2d').drawImage(frame, x, y, width, height, 0, 0, width, height);
					return await out.convertToBlob({ type: 'image/png' });
				} finally {
					track.stop();
				}
			}

			/** This moment as the background of the game's page; the game goes on. */
			async function capture() {
				const emulator = window.EJS_emulator;
				if (!emulator?.started || !backdrop.startsWith('/api/fondo/juego/')) return;
				const blob = await picture(emulator).catch(() => null);
				const res =
					blob &&
					(await fetch(backdrop, {
						method: 'POST',
						headers: { 'content-type': 'image/png' },
						body: blob
					}).catch(() => null));
				emulator.displayMessage(res?.ok ? 'Fondo guardado' : 'No se pudo guardar el fondo', 3000);
			}

			// Before EmulatorJS' own (capture phase): it takes every key, Back too.
			addEventListener(
				'keydown',
				(e) => {
					// The remote's Home (F7) to the TV view, as everywhere else: the frame gets the keys now.
					if (e.key === 'F7') parent.dispatchEvent(new KeyboardEvent('keydown', { key: 'F7' }));
					// Its Back: out of the game, to the page it was opened from. Done here, as EmulatorJS
					// stops the browser from doing it (preventDefault on every key).
					else if (e.key === 'BrowserBack') {
						e.preventDefault();
						if (!e.repeat) parent.history.back();
					}
					// Its Play/Pause (F8): this moment as the game's background.
					else if (e.key === 'F8') {
						e.preventDefault();
						if (!e.repeat) void capture();
					}
					// Its OK: the game's menu (in the page around, /jugar). Not to EmulatorJS, for which
					// Enter is Start: the gamepad has its own.
					else if (e.key === 'Enter') {
						e.preventDefault();
						e.stopImmediatePropagation();
						if (!e.repeat) openMenu();
					}
				},
				true
			);

			const openMenu = () => parent.dispatchEvent(new Event('juegos:menu'));

			// Select and Start at once on the gamepad (the standard mapping's 8 and 9): the menu too, for
			// who plays without the remote at hand.
			let both = false;
			requestAnimationFrame(function poll() {
				const pad = navigator.getGamepads().find((p) => p?.connected);
				const now = Boolean(pad?.buttons[8]?.pressed && pad.buttons[9]?.pressed);
				if (now && !both) openMenu();
				both = now;
				requestAnimationFrame(poll);
			});
		</script>
	</body>
</html>
