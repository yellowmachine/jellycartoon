.caracol-parpadeo { animation: caracol-parpadeo 1.4s ease-in-out infinite alternate; }
@keyframes caracol-parpadeo { from { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .caracol-antenas, .caracol-parpadeo { animation: none; } }
</style>

