# The voice satellite (#296) on a Raspberry (64-bit) or a PC, as installed: the published image,
# talking to Seilide (SERVER_URL, SATELLITE_KEY in the .env, from Seilide's Ajustes → Familia →
# «Satélites de voz»), and WUD keeping it up to date. See README.md.
#
#   docker compose -f compose.prod.yaml up -d
name: satelite

services:
  satellite:
    image: ghcr.io/yellowmachine/jellycartoon-satellite:${IMAGE_TAG:-stable}
    restart: unless-stopped
    devices:
      - /dev/snd
    group_add:
      - audio
    environment:
      MIC: ${MIC:-default}
      MIC_RATE: ${MIC_RATE:-48000}
      MIC_CHANNELS: ${MIC_CHANNELS:-2}
      # The word that wakes it (src/lib/wake-words.ts): hola_casita, or alexa.
      WAKE_WORD: ${WAKE_WORD:-hola_casita}
      WAKE_THRESHOLD: ${WAKE_THRESHOLD:-0.3}
      WAKE_MARGIN_DB: ${WAKE_MARGIN_DB:-15}
      TZ: ${TZ:-Europe/Madrid}
      SERVER_URL: ${SERVER_URL:?SERVER_URL is required}
      SATELLITE_KEY: ${SATELLITE_KEY:?SATELLITE_KEY is required}
      SPEAKER: ${SPEAKER:-}
      # The house's music (its snapserver, said by Seilide) on another device than the voice's.
      SNAPCLIENT_SOUNDCARD: ${SNAPCLIENT_SOUNDCARD:-}
    volumes:
      - ordenes:/data
    labels:
      # Updated by WUD to each release, as the house's app.
      - wud.watch=true

  # Each night, the new release if there is one: it pulls it and recreates the satellite as it was,
  # then removes the old image. As the house's (its compose.prod.yaml), without its web.
  wud:
    image: getwud/wud:9
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      WUD_WATCHER_LOCAL_CRON: ${UPDATE_CRON:-30 4 * * *}
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: 'false'
      WUD_TRIGGER_DOCKER_SATELITE_PRUNE: 'true'
      # Since WUD 9.6 it does not start without an administrator
      # (https://getwud.app/docs/configuration/authentications/), as the house's. Its web has no port
      # here: the password is only for it to start.
      WUD_AUTH_ADMIN_USER: admin
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_PASSWORD:?Falta WUD_PASSWORD en el .env (openssl rand -hex 16)}
    volumes:
      # Control of Docker: whoever controls WUD controls this machine's containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - wud_store:/store

  # Optional, with `dns` in COMPOSE_PROFILES (#355): the house's primary DNS, on a Raspberry that is
  # always on (the salon, secondary, with the same rewrite). Only on one of the satellites. As its
  # Docker image says (https://hub.docker.com/r/adguard/adguardhome): the first time, its wizard on
  # port 3000; in it, keep the web on port 3000 too. Pinned: WUD does not touch it (a new version
  # by hand), so that a night update never leaves the house without DNS.
  adguard:
    image: adguard/adguardhome:v0.107.79
    profiles: [dns]
    restart: unless-stopped
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 3000:3000/tcp
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

volumes:
  ordenes:
  wud_store:
  adguard_work:
  adguard_conf:
