# The voice satellite (#296) on a Raspberry (64-bit) or a PC, as installed: the published image,
# talking to Seilide (SERVER_URL, SATELLITE_KEY in the .env, from Seilide's Ajustes → Familia →
# «Satélites de voz»). Kept up to date by actualizar.sh (#643): only images signed with the family's
# key (cosign.pub, beside it), pinned by digest in SATELLITE_IMAGE. See README.md.
#
#   docker compose -f compose.prod.yaml up -d
name: satelite

services:
  satellite:
    # Set by actualizar.sh to the signed image's digest; without it, the channel's tag (the first time).
    image: ${SATELLITE_IMAGE:-ghcr.io/yellowmachine/jellycartoon-satellite:${IMAGE_TAG:-stable}}
    restart: unless-stopped
    # The host's network (#396): finding the Shelly plugs by mDNS, whose multicast Docker's bridge
    # does not pass. It opens one port, PLUG_PORT (8790), where the plugs connect (#643).
    network_mode: host
    devices:
      - /dev/snd
    group_add:
      - audio
    environment:
      MIC: ${MIC:-default}
      MIC_RATE: ${MIC_RATE:-48000}
      MIC_CHANNELS: ${MIC_CHANNELS:-2}
      # The word that wakes it (comun/wake-words.ts): hola_casita, alexa, okapi, ocarina, kusanagi, makoto or oye_alizee.
      # Only until the family chooses one in Seilide (Ajustes), which then counts for all of them.
      WAKE_WORD: ${WAKE_WORD:-hola_casita}
      WAKE_THRESHOLD: ${WAKE_THRESHOLD:-0.3}
      WAKE_MARGIN_DB: ${WAKE_MARGIN_DB:-15}
      WAKE_SILENCE_MS: ${WAKE_SILENCE_MS:-800}
      WAKE_EARLY_MS: ${WAKE_EARLY_MS:-300}
      # 1: the word cuts it while it waits for the answer or says it (#373).
      BARGE_IN: ${BARGE_IN:-0}
      TZ: ${TZ:-Europe/Madrid}
      SERVER_URL: ${SERVER_URL:?SERVER_URL is required}
      SATELLITE_KEY: ${SATELLITE_KEY:?SATELLITE_KEY is required}
      SPEAKER: ${SPEAKER:-}
      PLUG_PORT: ${PLUG_PORT:-8790}
      # Optional (#643): its page /alta opens the window to give a device with it, as «añade un
      # aparato» said to it. Only here, never in Seilide: not SATELLITE_KEY, which goes there.
      ALTA_CLAVE: ${ALTA_CLAVE:-}
      # The house's music (its snapserver, said by Seilide) on another device than the voice's.
      SNAPCLIENT_SOUNDCARD: ${SNAPCLIENT_SOUNDCARD:-}
    volumes:
      - ordenes:/data

  # Optional, with `dns` in COMPOSE_PROFILES (#355): the house's primary DNS, on a Raspberry that is
  # always on (the salon, secondary, with the same rewrite). Only on one of the satellites. As its
  # Docker image says (https://hub.docker.com/r/adguard/adguardhome): the first time, its wizard on
  # port 3000; in it, keep the web on port 3000 too. Pinned: nothing updates it (a new version
  # by hand), so that a night update never leaves the house without DNS.
  adguard:
    image: adguard/adguardhome:v0.107.79
    profiles: [dns]
    restart: unless-stopped
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 3000:3000/tcp
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

volumes:
  ordenes:
  adguard_work:
  adguard_conf:
