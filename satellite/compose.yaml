# The voice satellite (#223) on the Raspberry. While it is being made, built and run on it from the
# PC: DOCKER_HOST=ssh://clientpi.local docker compose -f satellite/compose.yaml up --build -d
services:
  satellite:
    build:
      context: ..
      dockerfile: satellite/Dockerfile
    image: jellycartoon-satellite:dev
    restart: unless-stopped
    # The host's network (#396): finding the Shelly plugs by mDNS, whose multicast Docker's bridge
    # does not pass. It opens no port.
    network_mode: host
    devices:
      - /dev/snd
    group_add:
      - audio
    environment:
      MIC: ${MIC:-default}
      MIC_RATE: ${MIC_RATE:-48000}
      MIC_CHANNELS: ${MIC_CHANNELS:-2}
      # The word that wakes it (comun/wake-words.ts): hola_casita, alexa, okapi, ocarina, kusanagi or makoto.
      # Only until the family chooses one in Seilide (Ajustes), which then counts for all of them.
      WAKE_WORD: ${WAKE_WORD:-hola_casita}
      WAKE_THRESHOLD: ${WAKE_THRESHOLD:-0.3}
      WAKE_MARGIN_DB: ${WAKE_MARGIN_DB:-15}
      WAKE_SILENCE_MS: ${WAKE_SILENCE_MS:-800}
      WAKE_EARLY_MS: ${WAKE_EARLY_MS:-300}
      # 1: the word cuts it while it waits for the answer or says it (#373).
      BARGE_IN: ${BARGE_IN:-0}
      TZ: ${TZ:-Europe/Madrid}
      SERVER_URL: ${SERVER_URL:-}
      SATELLITE_KEY: ${SATELLITE_KEY:-}
      SPEAKER: ${SPEAKER:-}
    volumes:
      - ordenes:/data

volumes:
  ordenes:
